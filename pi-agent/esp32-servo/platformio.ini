; PAX servo controller firmware for an ESP32 DevKit (WROOM-32).
;
; Build + flash from this folder:
;   pio run -t upload            (USB cable to the ESP32)
;   pio device monitor -b 460800 (type HELLO and press Enter to check it answers)
;
; Over Wi-Fi (standalone slave, after the first USB flash):
;   pio run -t upload --upload-port pax-esp32-xxxx.local   (ArduinoOTA, see
;   upload_flags below) — or open http://pax-esp32-xxxx.local/ in a browser
;   and upload .pio/build/esp32dev/firmware.bin (user "admin", OTA password).
;
; The same source also builds in the Arduino IDE: copy src/*.cpp and src/*.h
; into a sketch folder (rename main.cpp to pax_esp32.ino), board "ESP32 Dev
; Module", partition scheme "Minimal SPIFFS (large APPS with OTA)".

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 460800
upload_speed = 921600
; Two app slots so a failed OTA falls back to the previous firmware.
board_build.partitions = min_spiffs.csv
build_flags =
    -DPAX_FW_VERSION=\"1.6\"
    ; TCP port of the Wi-Fi link (the agent's default for --esp32-link wifi).
    -DPAX_LINK_PORT=8766
    ; Initial OTA / web-upload password; change it on the board with OTAPASS.
    -DPAX_OTA_PASSWORD_DEFAULT=\"pax-esp32\"
    ; Link baud for BOTH the USB port and the GPIO UART. Must match the
    ; "ESP32 baud" setting in the app (default 460800).
    -DPAX_LINK_BAUD=460800
    ; S-ON polarity. 0 = GPIO HIGH enables the drive (the NPN / ULN2003
    ; wiring in README.md). 1 = GPIO LOW enables (direct optocoupler hookup).
    -DPAX_ENA_LOW=0
